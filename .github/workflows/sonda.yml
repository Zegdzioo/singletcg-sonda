# Zewnętrzna sonda singletcg.pl: co 10 minut pyta /api/health spoza VPS.
# Czuwanie na serwerze (czuwanie.sh) nie zauważy, że padł cały serwer albo sieć -
# ta sonda tak. Alarm na Discord idzie tylko przy zmianie stanu (padło / wróciło),
# a GitHub sam wysyła maila właścicielowi o każdym nieudanym przebiegu.
name: sonda

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # pusty commit podtrzymujący (patrz niżej)
  actions: read     # wynik poprzedniego przebiegu

concurrency:
  group: sonda
  cancel-in-progress: false

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sklep odpowiada
        id: zdrowie
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 15 -A "singletcg-sonda (github actions)" https://singletcg.pl/api/health; then
              echo "stan=ok" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 20
          done
          echo "stan=blad" >> "$GITHUB_OUTPUT"

      - name: Alarm przy zmianie stanu
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STAN: ${{ steps.zdrowie.outputs.stan }}
        run: |
          poprzedni=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sonda.yml/runs?status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "success"')
          tresc=""
          if [ "$STAN" = "blad" ] && [ "$poprzedni" = "success" ]; then
            tresc="🔴 sonda spoza serwera: https://singletcg.pl/api/health nie odpowiada (3 próby w minutę)"
          elif [ "$STAN" = "ok" ] && [ "$poprzedni" = "failure" ]; then
            tresc="🟢 sonda spoza serwera: singletcg.pl znowu odpowiada"
          fi
          if [ -n "$tresc" ] && [ -n "$WEBHOOK" ]; then
            jq -nc --arg t "$tresc" '{content: $t}' | curl -fsS -m 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK" || true
          fi
          [ "$STAN" = "ok" ]

      # GitHub wyłącza harmonogram po 60 dniach bez aktywności w repozytorium.
      - name: Podtrzymanie harmonogramu
        if: always()
        run: |
          ostatni=$(gh api "repos/${GITHUB_REPOSITORY}/commits?per_page=1" --jq '.[0].commit.committer.date')
          if [ $(( ( $(date +%s) - $(date -d "$ostatni" +%s) ) / 86400 )) -ge 40 ]; then
            git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" r
            cd r && git -c user.name=sonda -c user.email=sonda@users.noreply.github.com \
              commit -q --allow-empty -m "podtrzymanie harmonogramu" && git push -q
          fi
        env:
          GH_TOKEN: ${{ github.token }}
